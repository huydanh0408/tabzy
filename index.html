<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabzy</title>
    <link rel="stylesheet" href="./src/tabzy.css" />
  </head>
  <body>
    <h1>Tabzy</h1>
    <!-- Container -->
    <ul id="tabs">
      <!-- Tabs -->
      <li><a href="#tab1">Tab 1</a></li>
      <li><a href="#tab2">Tab 2</a></li>
      <li><a href="#tab3">Tab 3</a></li>
    </ul>

    <!-- Panels -->
    <div id="tab1" class="tab">Tab 1 Content</div>
    <div id="tab2" class="tab">Tab 2 Content</div>
    <div id="tab3" class="tab">Tab 3 Content</div>

    <!-- Container2 -->
    <ul id="tabs2">
      <!-- Tabs2 -->
      <li><a href="#tab2a">Tab A</a></li>
      <li><a href="#tab2b">Tab B</a></li>
      <li><a href="#tab2c">Tab C</a></li>
    </ul>

    <!-- Panels2 -->
    <div id="tab2a" class="tab">Tab A Content</div>
    <div id="tab2b" class="tab">Tab B Content</div>
    <div id="tab2c" class="tab">Tab C Content</div>

    <script src="./src/tabzy.js"></script>
    <!-- Demo -->
    <script>
      const tabs = new Tabzy("#tabs", {
        remember: true,
        onChange: (data) => {
          console.log(data.tab, data.panel);
        },
      });

      const tabs2 = new Tabzy("#tabs2", {
        remember: true,
      });
    </script>
  </body>
</html>
